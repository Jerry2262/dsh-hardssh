# @jerry/dsh-hardssh bundle patch: inserts the plugin row into the web
# profile roster, and performs the SSH seam switch — disable the deployment's
# local filesystem/subprocess/bash-sandbox providers and mount the
# mode-routing facades (hardssh-fs / hardssh-subprocess / hardssh-shell)
# instead. Applied automatically as a profile bundle layer (the
# `dsh.bundle.patch` manifest field) when this package is installed — NO
# manual cordis.patch.yml editing needed.
#
# In SSH mode the model's read/write/edit/bash tools execute on the remote
# host transparently and under the session's permission preset; in local mode
# the facades delegate to the same sandboxed local implementations the
# disabled rows mounted.
- insert:
    - id: hardssh
      name: '@jerry/dsh-hardssh'

- id: fs-sandbox
  disabled: true

- id: subprocess
  disabled: true

# The native bash executor wraps every command in the LOCAL sandbox before it
# reaches the (replaced) subprocess seam, so in an SSH-bound session the client
# bwrap wrapper was shipped to the remote host. The routed shell row below
# keeps that native executor for local worlds and runs remote worlds through
# the provisioned remote Landlock launcher instead.
- id: bash-sandbox
  disabled: true

- insert:
    - id: hardssh-fs
      name: '@jerry/dsh-hardssh/fs'

    - id: hardssh-subprocess
      name: '@jerry/dsh-hardssh/subprocess'

    - id: hardssh-shell
      name: '@jerry/dsh-hardssh/shell-executor'
      config:
        timeoutMs: 60000